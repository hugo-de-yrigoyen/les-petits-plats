<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <script src="./scripts/main.js"></script>
    <title>Les petits plats</title>
  </head>
  <body>
    <header
      class="bg-header-background aspect-1440-667 bg-cover flex flex-col justify-center gap-8">
      <img
        src="images/logo.png"
        alt="Les Petits Plats"
        class="absolute top-12 left-16" />
      <h1
        class="text-5xl font-normal text-custom-yellow text-center max-w-3xl mx-auto font-title leading-[4rem]">
        CHERCHEZ PARMI PLUS DE 1500 RECETTES DU QUOTIDIEN, SIMPLES ET
        DÉLICIEUSES
      </h1>
      <div class="relative flex items-center mx-auto w-3/4">
        <input
          type="text"
          placeholder="Rechercher une recette, un ingrédient, ..."
          class="w-full p-6 ps-9 rounded-lg mx-auto font-paragraph"
          id="search-bar" />
        <button class="hidden absolute right-20" id="search-bar-erase">
          <img src="images/icons/cross-big.svg" alt="Erase text" />
        </button>
        <button class="absolute right-2.5">
          <img src="images/icons/search-icon.svg" alt="Search" id="search-bar-submit" />
        </button>
      </div>
    </header>
    <main class="bg-custom-grey px-28 pt-5 pb-52">
      <div class="flex justify-between mb-12">
        <div class="flex gap-16">
          <div
            id="filter-ingredients"
            class="bg-white rounded-lg py-4 max-h-80 overflow-scroll">
            <div class="flex justify-between mb-4 px-4">
              <span>Ingrédients</span>
              <img
                src="images/icons/caret.svg"
                alt="Ingrédients Les Petits Plats" />
            </div>
            <div
              class="relative flex items-center mb-4 pl-4 mr-4"
              id="ingredients-search-bar">
              <input
                class="h-8 rounded border-solid border w-full border-custom-light-grey js-search-bar" />
              <button class="hidden absolute right-8 js-search-bar-erase">
                <img src="images/icons/cross.svg" alt="Erase text" />
              </button>
              <button class="absolute right-2.5 js-search-bar-submit">
                <img
                  src="images/icons/magnifying-glass.svg"
                  alt="Search ingredient" />
              </button>
            </div>
            <ul
              class="flex flex-col text-sm mb-3 px-4 bg-custom-yellow js-dropdown-selected"></ul>
            <ul
              class="flex flex-col text-sm px-4 js-dropdown-unselected"
              id="js-dropdown-ingredients"></ul>
          </div>
          <div
            id="filter-appliances"
            class="bg-white rounded-lg py-4 max-h-80 overflow-scroll">
            <div class="flex justify-between mb-4 px-4">
              <span>Appareils</span>
              <img
                src="images/icons/caret.svg"
                alt="Ingrédients Les Petits Plats" />
            </div>
            <div
              class="relative flex items-center mb-4 pl-4 mr-4"
              id="appliances-search-bar">
              <input
                class="h-8 rounded border-solid border w-full border-custom-light-grey js-search-bar" />
              <button class="hidden absolute right-8 js-search-bar-erase">
                <img src="images/icons/cross.svg" alt="Erase text" />
              </button>
              <button class="absolute right-2.5 js-search-bar-submit">
                <img
                  src="images/icons/magnifying-glass.svg"
                  alt="Search appliances" />
              </button>
            </div>
            <ul
              class="flex flex-col text-sm mb-3 px-4 bg-custom-yellow js-dropdown-selected"></ul>
            <ul
              class="flex flex-col text-sm px-4 js-dropdown-unselected"
              id="js-dropdown-appliances"></ul>
          </div>
          <div
            id="filter-ustensils"
            class="bg-white rounded-lg py-4 max-h-80 overflow-scroll">
            <div class="flex justify-between mb-4 px-4">
              <span>Ustensiles</span>
              <img
                src="images/icons/caret.svg"
                alt="Ingrédients Les Petits Plats" />
            </div>
            <div
              class="relative flex items-center mb-4 pl-4 mr-4"
              id="ustensils-search-bar">
              <input
                class="h-8 rounded border-solid border w-full border-custom-light-grey js-search-bar" />
              <button class="hidden absolute right-8 js-search-bar-erase">
                <img src="images/icons/cross.svg" alt="Erase text" />
              </button>
              <button class="absolute right-2.5 js-search-bar-submit">
                <img
                  src="images/icons/magnifying-glass.svg"
                  alt="Search ustensils" />
              </button>
            </div>
            <ul
              class="flex flex-col text-sm mb-3 px-4 bg-custom-yellow js-dropdown-selected"></ul>
            <ul
              class="flex flex-col text-sm px-4 js-dropdown-unselected"
              id="js-dropdown-ustensils"></ul>
          </div>
        </div>
        <span class="text-xl font-normal font-title">1500 recettes</span>
      </div>
      <div
        class="grid grid-cols-3 gap-x-12 gap-y-16"
        id="js-recipes-container"></div>
    </main>
  </body>
</html>
